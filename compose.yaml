services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zero_human_company
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero_human_company"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - zero_human_postgres:/var/lib/postgresql/data

volumes:
  zero_human_postgres:
